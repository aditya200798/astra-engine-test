          #!/usr/bin/python3
          """Fixed disposable CI probe, synthetic only. Never starts an engine."""
          import errno, json, os, selectors, socket, subprocess, sys, time
          
          ENV = {'PATH': '/usr/bin:/bin', 'HOME': '/work/home', 'TMPDIR': '/work/tmp', 'LANG': 'C', 'LC_ALL': 'C'}
          
          
          def env_diagnostic(environ):
              # Never log unknown names or any values. Locale coercion is a known hypothesis.
              return {'exact': dict(environ) == ENV,
                      'expected_match': {key: environ.get(key) == value for key, value in ENV.items()},
                      'unexpected_count': len(set(environ) - set(ENV)),
                      'lc_ctype_present': 'LC_CTYPE' in environ}
          
          
          def env_gate(environ):
              diagnostic = env_diagnostic(environ)
              return diagnostic['exact'], diagnostic
          
          def server():
              s = socket.socket(); s.bind(('127.0.0.1', 0)); s.listen(1); s.settimeout(3)
              pid = os.fork()
              if pid == 0:
                  os.setsid()
                  f = os.open('/dev/null', os.O_RDWR)
                  for n in (0, 1, 2): os.dup2(f, n)
                  while True: time.sleep(1)
              print(json.dumps({'url':'http://127.0.0.1:%d' % s.getsockname()[1], 'descendant':pid}), flush=True)
              conn, _ = s.accept()
              with conn:
                  conn.settimeout(2)
                  assert conn.recv(1) == b'A'
                  conn.sendall(b'B')
              assert sys.stdin.buffer.read(1) == b''
              s.close()
          
          
          def route(family, kind, addr):
              try:
                  with socket.socket(family, kind) as s:
                      s.settimeout(.5); s.connect(addr)
                  return 'connected'
              except OSError as e:
                  return 'errno:%s' % e.errno
          
          
          def driver():
              checks = {}
              status = {}
              for line in open('/proc/self/status'):
                  if ':' in line:
                      k, v = line.split(':', 1); status[k] = v.strip()
              checks['env_exact'], env_report = env_gate(os.environ)
              checks['uid_nonroot'] = os.getuid() == 65534 and os.getgid() == 65534
              checks['no_caps_nnp'] = all(int(status.get(x, '1'), 16) == 0 for x in ('CapEff', 'CapPrm', 'CapInh', 'CapAmb')) and status.get('NoNewPrivs') == '1'
              checks['host_paths_hidden'] = not os.path.exists('/tmp/astra-boundary-host-sentinel') and not os.path.exists('/root') and not os.path.exists('/run') and not os.path.exists('/home/runner')
              checks['home_clean'] = os.listdir('/work/home') == [] and os.listdir('/work/tmp') == []
              checks['host_etc_hidden'] = not os.path.exists('/etc/passwd')
              checks['network'] = {str(x) for _, x in socket.if_nameindex()} == {'lo'}
              checks['routes'] = all(route(*args) == 'errno:%s' % errno.ENETUNREACH for args in [
                  (socket.AF_INET, socket.SOCK_DGRAM, ('192.0.2.53',53)),
                  (socket.AF_INET6, socket.SOCK_DGRAM, ('2001:db8::53',53)),
                  (socket.AF_INET, socket.SOCK_STREAM, ('192.0.2.1',9)),
                  (socket.AF_INET6, socket.SOCK_STREAM, ('2001:db8::1',9))])
              fds = []
              for n in os.listdir('/proc/self/fd'):
                  try: os.readlink('/proc/self/fd/' + n); fds.append(int(n))
                  except FileNotFoundError: pass
              checks['fds_only_stdio'] = sorted(fds) == [0,1,2]
              p = subprocess.Popen([sys.executable, '-I', '/probe.py', '--server'], env=ENV,
                                   stdin=subprocess.PIPE, stdout=subprocess.PIPE, stderr=subprocess.PIPE, close_fds=True)
              try:
                  sel = selectors.DefaultSelector()
                  sel.register(p.stdout, selectors.EVENT_READ); sel.register(p.stderr, selectors.EVENT_READ)
                  deadline = time.monotonic() + 4; buf = bytearray(); err = bytearray()
                  while b'\n' not in buf and time.monotonic() < deadline:
