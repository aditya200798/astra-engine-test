name: Engine-free synthetic no-bind target overlay - DISABLED
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: astra-synthetic-ci-shared
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Pinned historical artifact - disabled
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: aditya200798/astra-engine-test
          ref: 'dd9208dc191f3dddfb4f845bd5a5ef8d8cf2ede6'
          path: astra-genuine-input
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: ci-no-engine-6a570ae86913b6d42fd039d2d62902c8.tar.gz
          sparse-checkout-cone-mode: false
          lfs: false
          submodules: false
      - name: Fixed no-bind target probe - disabled
        shell: bash
        timeout-minutes: 8
        run: |
          set -euo pipefail
          echo 'genuine_ci=blocked_pending_review'
          # The following is disabled draft code; shell and privilege startup precede
          # the Python clock and remain an explicit platform-level limitation.
          sudo -n /usr/bin/env RUNNER_ENVIRONMENT="${RUNNER_ENVIRONMENT:-}" RUNNER_OS="${RUNNER_OS:-}" GITHUB_REPOSITORY="${GITHUB_REPOSITORY:-}" GITHUB_EVENT_NAME="${GITHUB_EVENT_NAME:-}" GITHUB_WORKSPACE="${GITHUB_WORKSPACE:-}" /usr/bin/python3 -I - <<'ASTRA_WHOLE_STEP'
          SUPERVISOR='#!/usr/bin/python3\n"""Disabled private step supervisor: NOT a containment/cleanup proof.\n\nA hypothetical reviewed caller starts this before setup. It owns an absolute\nmonotonic budget, runs setup and then a single scope client, never retries, and\nkeeps a separate cancellation window. It cannot cancel systemd manager jobs.\n"""\nimport json, math, os, select, signal, subprocess, time\n_BLOCKED=True\n_MAX_RECORD=4096\n\nclass StepError(RuntimeError):pass\n\ndef _supervise(setup_argv, scope_argv, *, start, total, cleanup, term_grace=1, validate=None):\n    """Private testable composition; argv are not a public launch interface.\n\n    scope_argv is already fully constructed by the privileged reviewed caller;\n    no file descriptor is claimed to cross sudo/systemd. The invocation uses\n    only standard streams for its result and a decimal absolute deadline argv.\n    """\n    vals=(start,total,cleanup,term_grace)\n    if (any(type(x) not in (int,float) or not math.isfinite(x) for x in vals)\n        or not (0<term_grace<cleanup<total<=480) or start>time.monotonic()):\n        raise StepError(\'budget\')\n    cutoff=start+total-cleanup;end=start+total\n    outcome={\'outcome\':\'unknown\',\'phase\':\'setup\',\'deadline\':\'not_expired\',\n             \'cleanup\':\'not_verified\',\'late_start\':\'not_reconciled\',\n             \'vm_decommission\':\'not_observed\',\'engine_launch_authorized\':False,\n             \'production_approved\':False,\'diagnostic\':None}\n    def child(argv, phase):\n        if time.monotonic()>=cutoff:return None,\'deadline\'\n        argv=argv(cutoff) if callable(argv) else argv\n        # A fresh session leader remains a zombie (hence its PID cannot be\n        # recycled) until wait(). Do not reap before the last group signal.\n        p=subprocess.Popen(argv,stdin=subprocess.DEVNULL,stdout=subprocess.PIPE,\n                           stderr=subprocess.DEVNULL,start_new_session=True,close_fds=True)\n        os.set_blocking(p.stdout.fileno(),False)\n        data=bytearray();eof=False;bad=False\n        while time.monotonic()<cutoff:\n            ready,_,_=select.select([p.stdout],[],[],min(.05,max(0,cutoff-time.monotonic()))) if not eof else ([],[],[])\n            if ready:\n                part=os.read(p.stdout.fileno(),_MAX_RECORD+1-len(data))\n                if not part:eof=True\n                else:\n                    data.extend(part)\n                    if len(data)>_MAX_RECORD:bad=True;break\n            exited=bool(os.waitid(os.P_PID,p.pid,os.WEXITED|os.WNOHANG|os.WNOWAIT))\n            if exited and eof:\n                p.stdout.close();rc=p.wait()\n                if time.monotonic()>=cutoff:return None,\'deadline\'\n                return (bytes(data),rc),\'returned\'\n        # Signal the exact child process group, not a guessed systemd unit.\n        try:os.killpg(p.pid,signal.SIGTERM)\n        except ProcessLookupError:pass\n        until=min(end,time.monotonic()+term_grace)\n        while time.monotonic()<until:time.sleep(max(0,min(.01,until-time.monotonic())))\n        try:os.killpg(p.pid,signal.SIGKILL)\n        except ProcessLookupError:pass\n        # Reap only after the final signal; no process-group reuse before here.\n        while time.monotonic()<end and p.poll() is None:time.sleep(.01)\n        p.stdout.close()\n        return None,\'invalid\' if bad else \'deadline\'\n    try:\n        r,why=child(setup_argv,\'setup\')\n        if why!=\'returned\' or r[1]!=0:\n            outcome[\'deadline\']=\'expired\' if why==\'deadline\' else \'not_expired\'\n            return outcome\n        outcome[\'phase\']=\'scope\'\n        # Decimal monotonic deadline is delivered by argv, not an inherited FD.\n        r,why=child(lambda deadline:[*scope_argv,format(deadline,\'.9f\')],\'scope\')\n        if why!=\'returned\' or r[1]!=0:\n            outcome[\'deadline\']=\'expired\' if why==\'deadline\' else \'not_expired\'\n            return outcome\n        raw=r[0]\n        def pairs(items):\n            d={}\n            for k,v in items:\n                if k in d:raise ValueError(\'duplicate\')\n                d[k]=v\n            return d\n        if not raw.endswith(b\'\\n\') or raw.count(b\'\\n\')!=1:raise ValueError(\'record\')\n        obj=json.loads(raw,object_pairs_hook=pairs)\n        # The contract is a fixed, finite result vocabulary, not raw subprocess text.\n        if validate is None:\n            from devtools import genuine_delegated_diagnostics as diag\n            validate=diag.validate\n        validate(obj)\n        outcome[\'diagnostic\']=obj;outcome[\'outcome\']=\'synthetic_diagnostic_returned_cleanup_unverified\'\n    except BaseException:\n        pass\n    return outcome\n\ndef main():\n    if _BLOCKED:raise StepError(\'review required\')\n    raise StepError(\'no approved orchestration\')\nif __name__==\'__main__\':\n    try:main()\n    except Exception:print(\'genuine_step=blocked\',flush=True);raise SystemExit(1)\n'
          SETUP_PARTS=['# Eligibility checks below are NOT a proof of VM isolation.\ntest "${GITHUB_EVENT_NAME:-}" = workflow_dispatch\ntest "$(nproc)" -ge 2\n# One root process owns bundle, extraction, and wrapper from creation. A\n# privileged private parent eliminates the writable /tmp reopen window.\n/usr/bin/python3 -I - "$1" "$2" <<\'ASTRA_PRIVILEGED_SETUP\'\nimport base64,os,hashlib,time,sys\ndef _fixed_artifact():\n import hashlib,re,stat\n if len(sys.argv)!=3:raise ValueError(\'workspace argument\')\n workspace=sys.argv[2]\n if not re.fullmatch(r\'/home/runner/work/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+\',workspace) or any(x in (\'.\',\'..\') for x in workspace.split(\'/\')):raise ValueError(\'workspace\')\n path=os.path.join(workspace,\'astra-genuine-input\',\'ci-no-engine-6a570ae86913b6d42fd039d2d62902c8.tar.gz\')\n fd=os.open(path,os.O_RDONLY|os.O_NOFOLLOW|os.O_CLOEXEC|os.O_NONBLOCK)\n try:\n  st=os.fstat(fd)\n  if not stat.S_ISREG(st.st_mode) or st.st_nlink!=1 or not 0<st.st_size<=16000000:raise ValueError(\'metadata\')\n  chunks=[];total=0\n  while total<=16000000:\n   b=os.read(fd,min(65536,16000001-total))\n   if not b:break\n   chunks.append(b);total+=len(b)\n  raw=b\'\'.join(chunks)\n  if len(raw)!=st.st_size or hashlib.sha256(raw).hexdigest()!=\'5666bc7d0f13a22078dbae4d4d2d3bb904c7bffb7241bfb55bf38b09c4147ff4\':raise ValueError(\'digest\')\n  return raw\n finally:os.close(fd)\nif time.monotonic()>=float(sys.argv[1]):raise SystemExit(1)\nos.mkdir(\'/run/astra-genuine-input\',0o700)\nos.chmod(\'/run/astra-genuine-input\',0o700)\nraw=_fixed_artifact()\n\nsource=\'"""Pure in-memory fixed archive overlay; not a CI authorization or sandbox."""\\nimport base64,gzip,hashlib,io,json,re,tarfile,zlib\\nH=lambda b:hashlib.sha256(b).hexdigest()\\nMAX_ARCHIVE=16_000_000;MAX_TOTAL=12_000_000;MAX_FILE=3_000_000\\nPATH=re.compile(r\\\'(?:astra|devtools)/[a-z0-9_]+\\\\.py|docs/ubuntu-runtime-manifest-20261119\\\\.json|docs/ubuntu-runtime-evidence-20261119/(?:download-list|extra-list|Packages\\\\.gz|BasePackages\\\\.gz)\\\\Z\\\')\\ndef members(raw,expected,schema):\\n if type(raw) is not bytes or not 0<len(raw)<=MAX_ARCHIVE or H(raw)!=expected:raise ValueError(\\\'archive pin\\\')\\n with tarfile.open(fileobj=io.BytesIO(raw),mode=\\\'r:gz\\\') as tar:\\n  m=tar.getmembers();names=[x.name for x in m]\\n  if len(m)>128 or len(names)!=len(set(names)) or any(not x.isfile() or x.size<0 or x.size>MAX_FILE for x in m) or sum(x.size for x in m)>MAX_TOTAL:raise ValueError(\\\'archive shape\\\')\\n  if \\\'BUNDLE-MANIFEST.json\\\' not in names:raise ValueError(\\\'manifest absent\\\')\\n  mr=tar.extractfile(\\\'BUNDLE-MANIFEST.json\\\').read(MAX_FILE+1);meta=json.loads(mr)\\n  if type(meta) is not dict or set(meta)!={\\\'schema\\\',\\\'files\\\'} or meta[\\\'schema\\\']!=schema or type(meta[\\\'files\\\']) is not dict or set(meta[\\\'files\\\'])!=set(names)-{\\\'BUNDLE-MANIFEST.json\\\'}:raise ValueError(\\\'manifest\\\')\\n  result={}\\n  for name,info in meta[\\\'files\\\'].items():\\n   if type(name) is not str or not PATH.fullmatch(name) or type(info) is not dict or set(info)!={\\\'size\\\',\\\'sha256\\\'} or type(info[\\\'size\\\']) is not int or type(info[\\\'sha256\\\']) is not str:raise ValueError(\\\'member metadata\\\')\\n   b=tar.extractfile(name).read(MAX_FILE+1)\\n   if len(b)!=info[\\\'size\\\'] or H(b)!=info[\\\'sha256\\\']:raise ValueError(\\\'member pin\\\')\\n   result[name]=b\\n  return result,mr\\n\\ndef repack(old,old_sha,payload_b64,payload_sha,final_sha):\\n if type(payload_b64) is not str or len(payload_b64)>250000:raise ValueError(\\\'payload length\\\')\\n compressed=base64.b64decode(payload_b64,validate=True)\\n if H(compressed)!=payload_sha:raise ValueError(\\\'payload pin\\\')\\n dec=zlib.decompressobj();payload=dec.decompress(compressed,1_000_001)\\n if len(payload)>1_000_000 or not dec.eof or dec.unused_data or dec.unconsumed_tail:raise ValueError(\\\'payload bound\\\')\\n data=json.loads(payload)\\n if type(data) is not dict or set(data)!={\\\'manifest\\\',\\\'files\\\'} or type(data[\\\'files\\\']) is not dict or len(data[\\\'files\\\'])>128:raise ValueError(\\\'payload shape\\\')\\n old_files,_=members(old,old_sha,\\\'astra-synthetic-no-engine-bundle-v1\\\')\\n final_manifest=base64.b64decode(data[\\\'manifest\\\'],validate=True);meta=json.loads(final_manifest)\\n if type(meta) is not dict or set(meta)!={\\\'schema\\\',\\\'files\\\'} or meta[\\\'schema\\\']!=\\\'astra-synthetic-genuine-candidate-v1\\\' or type(meta[\\\'files\\\']) is not dict:raise ValueError(\\\'final manifest\\\')\\n if not set(old_files)<=set(meta[\\\'files\\\']):raise ValueError(\\\'unexpected removal\\\')\\n changed={k for k in meta[\\\'files\\\'] if k not in old_files or H(old_files[k])!=meta[\\\'files\\\'][k].get(\\\'sha256\\\') or len(old_files[k])!=meta[\\\'files\\\'][k].get(\\\'size\\\')}\\n if changed!=set(data[\\\'files\\\']):raise ValueError(\\\'delta set\\\')\\n files=dict(old_files)\\n for k,v in data[\\\'files\\\'].items():\\n  if type(k) is not str or not PATH.fullmatch(k) or type(v) is not str or len(v)>4_000_000:raise ValueError(\\\'delta member\\\')\\n  files[k]=base64.b64decode(v,validate=True)\\n for k,info in meta[\\\'files\\\'].items():\\n  if not PATH.fullmatch(k) or type(info) is not dict or set(info)!={\\\'sha256\\\',\\\'size\\\'} or type(info[\\\'size\\\']) is not int or len(files[k])!=info[\\\'size\\\'] or H(files[k])!=info[\\\'sha256\\\']:raise ValueError(\\\'final member\\\')\\n if len(files)>127 or sum(map(len,files.values()))+len(final_manifest)>MAX_TOTAL:raise ValueError(\\\'final bounds\\\')\\n out=io.BytesIO()\\n with gzip.GzipFile(fileobj=out,mode=\\\'wb\\\',mtime=0,filename=\\\'\\\',compresslevel=9) as gz:\\n  with tarfile.open(fileobj=gz,mode=\\\'w\\\',format=tarfile.PAX_FORMAT) as tar:\\n   for name,b in [(\\\'BUNDLE-MANIFEST.json\\\',final_manifest),*sorted(files.items())]:\\n    info=tarfile.TarInfo(name);info.size=len(b);info.mode=0o444;info.uid=info.gid=0;info.mtime=0;tar.addfile(info,io.BytesIO(b))\\n raw=out.getvalue()\\n if len(raw)>MAX_ARCHIVE or (final_sha is not None and H(raw)!=final_sha):raise ValueError(\\\'repacked pin\\\')\\n members(raw,H(raw),\\\'astra-synthetic-genuine-candidate-v1\\\')\\n return raw\\n\'\no={\'__name__\':\'fixed_overlay\'}\nexec(compile(source,\'<fixed overlay>\',\'exec\'),o)\nraw=o[\'repack\'](raw,\'5666bc7d0f13a22078dbae4d4d2d3bb904c7bffb7241bfb55bf38b09c4147ff4\',\'', '', '', '', '\',\'574eef7d6c0e305995e3d2c335360a3f91b83f5bd0c44563927e6a5831b6b2e7\',\'6b92bcc9d77338b1b723adc5c4805e5c9f1cc99b7b238e14855b7a4e54a77995\')\nfd=os.open(\'/run/astra-genuine-input/bundle.tar.gz\',os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW|os.O_CLOEXEC,0o400)\ntry:\n os.fchmod(fd,0o400)\n while raw:\n  n=os.write(fd,raw)\n  if n<=0:raise RuntimeError(\'write\')\n  raw=raw[n:]\n os.fsync(fd)\nfinally:os.close(fd)\n# Fixed exact inline source, not a source file reopened after a hash check.\nbootstrap=\'#!/usr/bin/python3\\n"""Fixed digest-pinned synthetic CI bundle extractor; candidate only.\\n\\nMust itself be pinned and reviewed before privileged execution. It receives no\\npath arguments; writes only one new mode-0700 root directory. Does not run the\\nbundle, manage cgroups or authorize CI. GitHub VM and no-concurrent-writer\\nassumptions remain external. Never use with secrets, user data or outside a disposable synthetic VM.\\n"""\\nimport hashlib, io, json, os, re, stat, sys, tarfile\\n\\nBUNDLE="/run/astra-genuine-input/bundle.tar.gz"\\nDEST="/run/astra-genuine-bundle"\\nBUNDLE_SHA="85a918952dc0e78561f0a5e65049a63fc1e6a1a7e3d72afc2885f68a6401c5d8"\\nMAX_BUNDLE=16_000_000\\nMAX_TOTAL=12_000_000\\nMAX_FILE=3_000_000\\nPATH=re.compile(r"(?:astra|devtools)/[a-z0-9_]+\\\\.py|docs/ubuntu-runtime-manifest-20261119\\\\.json|docs/ubuntu-runtime-evidence-20261119/(?:download-list|extra-list|Packages\\\\.gz|BasePackages\\\\.gz)\\\\Z")\\n\\n\\ndef _read_exact(fd,limit):\\n    out=[];total=0\\n    while total<=limit:\\n        chunk=os.read(fd,min(65536,limit+1-total))\\n        if not chunk:break\\n        out.append(chunk);total+=len(chunk)\\n    if total>limit:raise ValueError(\\\'too large\\\')\\n    return b\\\'\\\'.join(out)\\n\\n\\ndef _extract(bundle,dest,expected):\\n    """Testable bounded extractor; paths/expected are not public CLI options.\\n\\n    Parent must be exclusively controlled. O_EXCL and O_NOFOLLOW avoid common\\n    collisions, but are not a substitute for trusted parent or VM ownership.\\n    On failure the partially created directory must not be reused.\\n    """\\n    fd=os.open(bundle,os.O_RDONLY|os.O_NOFOLLOW|os.O_CLOEXEC|os.O_NONBLOCK)\\n    try:\\n        before=os.fstat(fd)\\n        if not stat.S_ISREG(before.st_mode) or before.st_nlink!=1:raise ValueError(\\\'bundle file\\\')\\n        raw=_read_exact(fd,MAX_BUNDLE)\\n        if (len(raw)!=before.st_size or hashlib.sha256(raw).hexdigest()!=expected or\\n            os.fstat(fd).st_mtime_ns!=before.st_mtime_ns):raise ValueError(\\\'bundle hash\\\')\\n    finally:os.close(fd)\\n    # Digest matches the entire pre-reviewed archive before decompression.\\n    with tarfile.open(fileobj=io.BytesIO(raw),mode=\\\'r:gz\\\') as tar:\\n        members=tar.getmembers()\\n        if len(members)>128 or len(members)!=len({m.name for m in members}):raise ValueError(\\\'members\\\')\\n        names={m.name for m in members}\\n        if \\\'BUNDLE-MANIFEST.json\\\' not in names:raise ValueError(\\\'manifest\\\')\\n        if any(not m.isfile() or m.size<0 or m.size>MAX_FILE for m in members):raise ValueError(\\\'member\\\')\\n        meta=json.load(tar.extractfile(\\\'BUNDLE-MANIFEST.json\\\'))\\n        if type(meta) is not dict or set(meta)!={\\\'schema\\\',\\\'files\\\'} or meta[\\\'schema\\\']!=\\\'astra-synthetic-genuine-candidate-v1\\\' or type(meta[\\\'files\\\']) is not dict:\\n            raise ValueError(\\\'manifest schema\\\')\\n        files=meta[\\\'files\\\']\\n        if set(files)!=names-{\\\'BUNDLE-MANIFEST.json\\\'} or sum(m.size for m in members)>MAX_TOTAL:raise ValueError(\\\'contents\\\')\\n        payload={}\\n        for name,info in files.items():\\n            if not PATH.fullmatch(name) or type(info) is not dict or set(info)!={\\\'sha256\\\',\\\'size\\\'}:raise ValueError(\\\'filename\\\')\\n            content=tar.extractfile(name).read(MAX_FILE+1)\\n            if len(content)!=info[\\\'size\\\'] or hashlib.sha256(content).hexdigest()!=info[\\\'sha256\\\']:raise ValueError(\\\'digest\\\')\\n            payload[name]=content\\n    os.mkdir(dest,0o700)\\n    os.chmod(dest,0o700)\\n    for name,data in sorted(payload.items()):\\n        directory,leaf=name.rsplit(\\\'/\\\',1)\\n        current=dest\\n        for part in directory.split(\\\'/\\\'):\\n            current=os.path.join(current,part)\\n            try:os.mkdir(current,0o700)\\n            except FileExistsError:\\n                s=os.lstat(current)\\n                if not stat.S_ISDIR(s.st_mode) or s.st_uid!=os.geteuid():raise ValueError(\\\'directory\\\')\\n        out=os.open(os.path.join(current,leaf),os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW|os.O_CLOEXEC,0o400)\\n        try:\\n            os.fchmod(out,0o400);view=memoryview(data)\\n            while view:\\n                n=os.write(out,view)\\n                if n<=0:raise ValueError(\\\'write\\\')\\n                view=view[n:]\\n            os.fsync(out)\\n        finally:os.close(out)\\n    return len(payload)\\n\\n\\ndef main():\\n    if len(sys.argv)!=1 or os.geteuid()!=0:raise ValueError(\\\'not fixed root invocation\\\')\\n    n=_extract(BUNDLE,DEST,BUNDLE_SHA)\\n    print(\\\'fixed_bundle=verified_extracted files=\\\'+str(n),flush=True)\\nif __name__==\\\'__main__\\\':\\n    try:main()\\n    except Exception:\\n        print(\\\'fixed_bundle=unknown\\\',flush=True);sys.exit(1)\\n\'\nns={\'__name__\':\'astra_ci_inline_bootstrap\'}\nexec(compile(bootstrap,\'<fixed synthetic bootstrap>\',\'exec\'),ns)\nns[\'BUN