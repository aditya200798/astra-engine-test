name: Astra real OpenCode synthetic identity-fixed
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: astra-synthetic-ci-shared
  cancel-in-progress: false
jobs:
  synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Fetch source and pinned release
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/astra-test/app" "$RUNNER_TEMP/astra-test/engine"
          cd "$RUNNER_TEMP/astra-test"
          curl --fail --silent --show-error --location --max-time 60 -o source.tar.gz 'https://raw.githubusercontent.com/aditya200798/astra-engine-test/a526199a6e6456ab17728319db2fa703afc3969e/coding-synthetic-engine-once-20261121.tar.gz'
          echo '546493abafaf3e5bd6b2eba54c0be8f184f0d01b8e430c08897501bdf081c897  source.tar.gz' | sha256sum -c -
          curl --fail --silent --show-error --location --max-time 180 -o release.tar.gz 'https://github.com/anomalyco/opencode/releases/download/v2.3.2/opencode-linux-x64.tar.gz'
          echo '563b5d663637226b6e3bb4bb6803281bc39b0d2cd88db06d674b6420aab009b0  release.tar.gz' | sha256sum -c -
          python3 - <<'PY'
          import hashlib, json, pathlib, stat, tarfile
          root=pathlib.Path('.')
          with tarfile.open('source.tar.gz','r:gz') as t:
              members=t.getmembers()
              if len(members)!=121 or len({m.name for m in members})!=121 or not all(m.isfile() for m in members): raise ValueError('source structure')
              manifest=json.load(t.extractfile('BUNDLE-MANIFEST.json'))
              if manifest.get('schema')!='astra-synthetic-genuine-candidate-v1' or set(manifest['files'])!={m.name for m in members}-{'BUNDLE-MANIFEST.json'}: raise ValueError('source manifest')
              for m in members:
                  if m.name=='BUNDLE-MANIFEST.json': continue
                  p=pathlib.PurePosixPath(m.name)
                  if p.is_absolute() or '..' in p.parts: raise ValueError('source path')
                  b=t.extractfile(m).read()
                  if manifest['files'][m.name]!={'sha256':hashlib.sha256(b).hexdigest(),'size':len(b)}: raise ValueError('source digest')
                  dest=root/'app'/m.name;dest.parent.mkdir(parents=True,exist_ok=True);dest.write_bytes(b)
          with tarfile.open('release.tar.gz','r:gz') as t:
              members=t.getmembers()
              if len(members)!=1 or members[0].name!='opencode' or not members[0].isfile() or members[0].size!=252848304 or stat.S_IMODE(members[0].mode)!=0o755: raise ValueError('release layout')
              h=hashlib.sha256();total=0
              with t.extractfile(members[0]) as src, open('engine/opencode','xb') as out:
                  while b:=src.read(1048576): out.write(b);h.update(b);total+=len(b)
              if total!=252848304 or h.hexdigest()!='e6543f6e5c39c40971ba38afd1819ac852c29ac735b5a89065d3d148d47f27ad': raise ValueError('engine digest')
          PY
          chmod -R a+rX app
          chmod 0555 engine engine/opencode
      - name: Run one fixed synthetic scenario
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/astra-test"
          container="astra-synthetic-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() { docker rm -f "$container" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker pull python:3.12-slim-bookworm@sha256:935c3c5b12357a7e10caa9c1e6ca5692344d97cf229832ef584be2cec9fc03df
          timeout --signal=TERM --kill-after=10s 240s docker run --name "$container" --network none --read-only --user 0:0 --cap-drop ALL --cap-add SETUID --cap-add SETGID --security-opt no-new-privileges --pids-limit 64 --memory 1g --tmpfs /work:rw,nosuid,nodev,uid=65534,gid=65534,mode=0700 --mount "type=bind,src=$PWD/app,dst=/app,readonly" --mount "type=bind,src=$PWD/engine,dst=/engine,readonly" --entrypoint /usr/bin/env python:3.12-slim-bookworm@sha256:935c3c5b12357a7e10caa9c1e6ca5692344d97cf229832ef584be2cec9fc03df -i PATH=/usr/bin:/bin HOME=/work/home TMPDIR=/work/tmp LANG=C LC_ALL=C /usr/local/bin/python3 -I -S -B -c '
          import os,sys
          os.setgroups([]);os.setgid(65534);os.setuid(65534)
          if (os.getuid(),os.geteuid(),os.getgid(),os.getegid(),os.getgroups())!=(65534,65534,65534,65534,[]): raise RuntimeError("identity drop failed")
          sys.path.insert(0,"/app")
          from devtools.genuine_run_layout import prepare_fixed_service_work
          from devtools.coding_service_entry import main
          prepare_fixed_service_work()
          st=os.stat("/engine/opencode",follow_symlinks=False)
          sys.argv[:]=[sys.argv[0]]
          raise SystemExit(main((st.st_dev,st.st_ino)))
          '
