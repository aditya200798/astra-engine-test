name: Astra Alpine musl startup diagnostic
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: astra-synthetic-ci-shared
  cancel-in-progress: false
jobs:
  synthetic:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 12
    steps:
      - name: Fetch source and pinned release
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/astra-test/app" "$RUNNER_TEMP/astra-test/engine"
          cd "$RUNNER_TEMP/astra-test"
          curl --fail --silent --show-error --location --max-time 60 -o source.tar.gz 'https://raw.githubusercontent.com/aditya200798/astra-engine-test/a526199a6e6456ab17728319db2fa703afc3969e/coding-synthetic-engine-once-20261121.tar.gz'
          echo '546493abafaf3e5bd6b2eba54c0be8f184f0d01b8e430c08897501bdf081c897  source.tar.gz' | sha256sum -c -
          curl --fail --silent --show-error --location --max-time 180 -o release.tar.gz 'https://github.com/anomalyco/opencode/releases/download/v2.3.2/opencode-linux-arm64-musl.tar.gz'
          echo '2148ba748f5410177868ed67d59ef70626cb6bd4fb2abc5177c807adfdc24fc3  release.tar.gz' | sha256sum -c -
          python3 - <<'PY'
          import hashlib, json, pathlib, stat, tarfile
          root=pathlib.Path('.')
          with tarfile.open('source.tar.gz','r:gz') as t:
              members=t.getmembers()
              if len(members)!=121 or len({m.name for m in members})!=121 or not all(m.isfile() for m in members): raise ValueError('source structure')
              manifest=json.load(t.extractfile('BUNDLE-MANIFEST.json'))
              if manifest.get('schema')!='astra-synthetic-genuine-candidate-v1' or set(manifest['files'])!={m.name for m in members}-{'BUNDLE-MANIFEST.json'}: raise ValueError('source manifest')
              for m in members:
                  if m.name=='BUNDLE-MANIFEST.json': continue
                  p=pathlib.PurePosixPath(m.name)
                  if p.is_absolute() or '..' in p.parts: raise ValueError('source path')
                  b=t.extractfile(m).read()
                  if manifest['files'][m.name]!={'sha256':hashlib.sha256(b).hexdigest(),'size':len(b)}: raise ValueError('source digest')
                  dest=root/'app'/m.name;dest.parent.mkdir(parents=True,exist_ok=True);dest.write_bytes(b)
          with tarfile.open('release.tar.gz','r:gz') as t:
              members=t.getmembers()
              if len(members)!=1 or members[0].name!='opencode' or not members[0].isfile() or members[0].size!=247667816 or stat.S_IMODE(members[0].mode)!=0o755: raise ValueError('release layout')
              h=hashlib.sha256();total=0
              with t.extractfile(members[0]) as src, open('engine/opencode','xb') as out:
                  while b:=src.read(1048576): out.write(b);h.update(b);total+=len(b)
              if total!=247667816 or h.hexdigest()!='0e214ccebc6f0dd8775be65104b8a9de0585427b8911ad838c9fd83d1c812e2d': raise ValueError('engine digest')
              print('ARM64 archive member sha256='+h.hexdigest()+' size='+str(total),flush=True)
          with open('engine/opencode','rb') as f:
              head=f.read(64)
          if head[:6]!=b'\x7fELF\x02\x01' or int.from_bytes(head[18:20],'little')!=183: raise ValueError('not ARM64 ELF')
          PY
          chmod -R a+rX app
          sudo chown root:root engine engine/opencode
          sudo chmod 0555 engine engine/opencode
      - name: Diagnose fixed synthetic startup
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/astra-test"
          container="astra-musl-diag-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() { docker rm -f "$container" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker pull python:3.12-alpine3.23@sha256:42cd3a725900d91376853e81e3e345fb42deef1956b336db3f8667055395eecf
          timeout --signal=TERM --kill-after=5s 90s docker run --name "$container" --network none --read-only --user 0:0 --cap-drop ALL --cap-add SETUID --cap-add SETGID --security-opt no-new-privileges --pids-limit 64 --memory 1g --tmpfs /work:rw,nosuid,nodev,uid=65534,gid=65534,mode=0700 --mount "type=bind,src=$PWD/engine,dst=/engine,readonly" --entrypoint /usr/bin/env python:3.12-alpine3.23@sha256:42cd3a725900d91376853e81e3e345fb42deef1956b336db3f8667055395eecf -i PATH=/usr/bin:/bin HOME=/work/home TMPDIR=/work/tmp LANG=C LC_ALL=C /usr/local/bin/python3 -I -S -B -c '
          import os,sys,subprocess,time
          os.setgroups([]);os.setgid(65534);os.setuid(65534)
          for d in ("home","config","data","cache","state","tmp","project"):os.mkdir("/work/"+d,0o700)
          env={"PATH":"/usr/bin:/bin","HOME":"/work/home","TMPDIR":"/work/tmp","LANG":"C","LC_ALL":"C","XDG_CONFIG_HOME":"/work/config","XDG_DATA_HOME":"/work/data","XDG_CACHE_HOME":"/work/cache","XDG_STATE_HOME":"/work/state","OPENCODE_DISABLE_MODELS_FETCH":"1","OPENCODE_CONFIG_PROJECT_DISABLE":"1","OPENCODE_DISABLE_CLAUDE_CODE":"1","OPENCODE_FILEWATCHER_DISABLE":"1","OPENCODE_DISABLE_FFF":"1","OPENCODE_SERVER_PASSWORD":"synthetic-test-only"}
          p=subprocess.run(["/engine/opencode","--version"],cwd="/work/project",env=env,stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=20)
          print("version_returncode=",p.returncode,"version_stdout=",repr(p.stdout[:1024]),"version_stderr=",repr(p.stderr[:4096]),flush=True)
          if p.returncode:raise SystemExit(1)
          p=subprocess.Popen(["/engine/opencode","serve","--stdio","--hostname","127.0.0.1","--port","0"],cwd="/work/project",env=env,stdin=subprocess.PIPE,stdout=subprocess.PIPE,stderr=subprocess.PIPE)
          try:out,err=p.communicate(timeout=12)
          except subprocess.TimeoutExpired:
              p.kill();out,err=p.communicate(timeout=5)
              print("server_timed_out=true",flush=True)
          print("server_returncode=",p.returncode,"server_stdout=",repr(out[:2048]),"server_stderr=",repr(err[:8192]),flush=True)
          '
