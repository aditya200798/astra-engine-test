name: Astra no-engine overlay one-shot
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: astra-no-engine-98e0df9fc63d380c69a9cf9efe72c715
  cancel-in-progress: false
jobs:
  control:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fixed artifact checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: aditya200798/astra-engine-test
          ref: 'dd9208dc191f3dddfb4f845bd5a5ef8d8cf2ede6'
          path: astra-no-engine-input
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: ci-no-engine-6a570ae86913b6d42fd039d2d62902c8.tar.gz
          sparse-checkout-cone-mode: false
          lfs: false
          submodules: false
      - name: Bounded no-engine native control
        shell: bash
        timeout-minutes: 8
        run: |
          set -euo pipefail
          sudo -n /usr/bin/env -i RUNNER_ENVIRONMENT="${RUNNER_ENVIRONMENT:-}" RUNNER_OS="${RUNNER_OS:-}" GITHUB_REPOSITORY="${GITHUB_REPOSITORY:-}" GITHUB_EVENT_NAME="${GITHUB_EVENT_NAME:-}" GITHUB_WORKSPACE="${GITHUB_WORKSPACE:-}" /usr/bin/python3 -I - <<'ASTRA_WHOLE_STEP'
          SUPERVISOR='#!/usr/bin/python3\n"""Disabled private step supervisor: NOT a containment/cleanup proof.\n\nA hypothetical reviewed caller starts this before setup. It owns an absolute\nmonotonic budget, runs setup and then a single scope client, never retries, and\nkeeps a separate cancellation window. It cannot cancel systemd manager jobs.\n"""\nimport json, math, os, select, signal, subprocess, time\n_BLOCKED=True\n_MAX_RECORD=4096\n\nclass StepError(RuntimeError):pass\n\ndef _supervise(setup_argv, scope_argv, *, start, total, cleanup, term_grace=1, validate=None):\n    """Private testable composition; argv are not a public launch interface.\n\n    scope_argv is already fully constructed by the privileged reviewed caller;\n    no file descriptor is claimed to cross sudo/systemd. The invocation uses\n    only standard streams for its result and a decimal absolute deadline argv.\n    """\n    vals=(start,total,cleanup,term_grace)\n    if (any(type(x) not in (int,float) or not math.isfinite(x) for x in vals)\n        or not (0<term_grace<cleanup<total<=480) or start>time.monotonic()):\n        raise StepError(\'budget\')\n    cutoff=start+total-cleanup;end=start+total\n    outcome={\'outcome\':\'unknown\',\'phase\':\'setup\',\'deadline\':\'not_expired\',\n             \'cleanup\':\'not_verified\',\'late_start\':\'not_reconciled\',\n             \'vm_decommission\':\'not_observed\',\'engine_launch_authorized\':False,\n             \'production_approved\':False,\'diagnostic\':None}\n    def child(argv, phase):\n        if time.monotonic()>=cutoff:return None,\'deadline\'\n        argv=argv(cutoff) if callable(argv) else argv\n        # A fresh session leader remains a zombie (hence its PID cannot be\n        # recycled) until wait(). Do not reap before the last group signal.\n        p=subprocess.Popen(argv,stdin=subprocess.DEVNULL,stdout=subprocess.PIPE,\n                           stderr=subprocess.DEVNULL,start_new_session=True,close_fds=True)\n        os.set_blocking(p.stdout.fileno(),False)\n        data=bytearray();eof=False;bad=False\n        while time.monotonic()<cutoff:\n            ready,_,_=select.select([p.stdout],[],[],min(.05,max(0,cutoff-time.monotonic()))) if not eof else ([],[],[])\n            if ready:\n                part=os.read(p.stdout.fileno(),_MAX_RECORD+1-len(data))\n                if not part:eof=True\n                else:\n                    data.extend(part)\n                    if len(data)>_MAX_RECORD:bad=True;break\n            exited=bool(os.waitid(os.P_PID,p.pid,os.WEXITED|os.WNOHANG|os.WNOWAIT))\n            if exited and eof:\n                p.stdout.close();rc=p.wait()\n                if time.monotonic()>=cutoff:return None,\'deadline\'\n                return (bytes(data),rc),\'returned\'\n        # Signal the exact child process group, not a guessed systemd unit.\n        try:os.killpg(p.pid,signal.SIGTERM)\n        except ProcessLookupError:pass\n        until=min(end,time.monotonic()+term_grace)\n        while time.monotonic()<until:time.sleep(max(0,min(.01,until-time.monotonic())))\n        try:os.killpg(p.pid,signal.SIGKILL)\n        except ProcessLookupError:pass\n        # Reap only after the final signal; no process-group reuse before here.\n        while time.monotonic()<end and p.poll() is None:time.sleep(.01)\n        p.stdout.close()\n        return None,\'invalid\' if bad else \'deadline\'\n    try:\n        r,why=child(setup_argv,\'setup\')\n        if why!=\'returned\' or r[1]!=0:\n            outcome[\'deadline\']=\'expired\' if why==\'deadline\' else \'not_expired\'\n            return outcome\n        outcome[\'phase\']=\'scope\'\n        # Decimal monotonic deadline is delivered by argv, not an inherited FD.\n        r,why=child(lambda deadline:[*scope_argv,format(deadline,\'.9f\')],\'scope\')\n        if why!=\'returned\' or r[1]!=0:\n            outcome[\'deadline\']=\'expired\' if why==\'deadline\' else \'not_expired\'\n            return outcome\n        raw=r[0]\n        def pairs(items):\n            d={}\n            for k,v in items:\n                if k in d:raise ValueError(\'duplicate\')\n                d[k]=v\n            return d\n        if not raw.endswith(b\'\\n\') or raw.count(b\'\\n\')!=1:raise ValueError(\'record\')\n        obj=json.loads(raw,object_pairs_hook=pairs)\n        # The contract is a fixed, finite result vocabulary, not raw subprocess text.\n        if validate is None:\n            from devtools import genuine_delegated_diagnostics as diag\n            validate=diag.validate\n        validate(obj)\n        outcome[\'diagnostic\']=obj;outcome[\'outcome\']=\'synthetic_diagnostic_returned_cleanup_unverified\'\n    except BaseException:\n        pass\n    return outcome\n\ndef main():\n    if _BLOCKED:raise StepError(\'review required\')\n    raise StepError(\'no approved orchestration\')\nif __name__==\'__main__\':\n    try:main()\n    except Exception:print(\'genuine_step=blocked\',flush=True);raise SystemExit(1)\n'
          SETUP='set -euo pipefail\n/usr/bin/python3 -I - "$1" "$2" <<\'ASTRA_SETUP\'\nimport hashlib,os,re,stat,sys,time\nBUNDLE_SHA=\'5666bc7d0f13a22078dbae4d4d2d3bb904c7bffb7241bfb55bf38b09c4147ff4\'\nBOOT=\'#!/usr/bin/python3\\n"""Fixed digest-pinned synthetic CI bundle extractor; candidate only.\\n\\nMust itself be pinned and reviewed before privileged execution. It receives no\\npath arguments; writes only one new mode-0700 root directory. Does not run the\\nbundle, manage cgroups or authorize CI. GitHub VM and no-concurrent-writer\\nassumptions remain external. Never use with secrets, user data or real engine.\\n"""\\nimport hashlib, io, json, os, re, stat, sys, tarfile\\n\\nBUNDLE="/tmp/astra-synthetic-ci-bundle.tar.gz"\\nDEST="/run/astra-synthetic-bundle"\\nBUNDLE_SHA="5666bc7d0f13a22078dbae4d4d2d3bb904c7bffb7241bfb55bf38b09c4147ff4"\\nMAX_BUNDLE=16_000_000\\nMAX_TOTAL=12_000_000\\nMAX_FILE=3_000_000\\nPATH=re.compile(r"(?:astra|devtools)/[a-z0-9_]+\\\\.py|docs/ubuntu-runtime-manifest-20261119\\\\.json|docs/ubuntu-runtime-evidence-20261119/(?:download-list|extra-list|Packages\\\\.gz|BasePackages\\\\.gz)\\\\Z")\\n\\n\\ndef _read_exact(fd,limit):\\n    out=[];total=0\\n    while total<=limit:\\n        chunk=os.read(fd,min(65536,limit+1-total))\\n        if not chunk:break\\n        out.append(chunk);total+=len(chunk)\\n    if total>limit:raise ValueError(\\\'too large\\\')\\n    return b\\\'\\\'.join(out)\\n\\n\\ndef _extract(bundle,dest,expected):\\n    """Testable bounded extractor; paths/expected are not public CLI options.\\n\\n    Parent must be exclusively controlled. O_EXCL and O_NOFOLLOW avoid common\\n    collisions, but are not a substitute for trusted parent or VM ownership.\\n    On failure the partially created directory must not be reused.\\n    """\\n    fd=os.open(bundle,os.O_RDONLY|os.O_NOFOLLOW|os.O_CLOEXEC|os.O_NONBLOCK)\\n    try:\\n        before=os.fstat(fd)\\n        if not stat.S_ISREG(before.st_mode) or before.st_nlink!=1:raise ValueError(\\\'bundle file\\\')\\n        raw=_read_exact(fd,MAX_BUNDLE)\\n        if (len(raw)!=before.st_size or hashlib.sha256(raw).hexdigest()!=expected or\\n            os.fstat(fd).st_mtime_ns!=before.st_mtime_ns):raise ValueError(\\\'bundle hash\\\')\\n    finally:os.close(fd)\\n    # Digest matches the entire pre-reviewed archive before decompression.\\n    with tarfile.open(fileobj=io.BytesIO(raw),mode=\\\'r:gz\\\') as tar:\\n        members=tar.getmembers()\\n        if len(members)>128 or len(members)!=len({m.name for m in members}):raise ValueError(\\\'members\\\')\\n        names={m.name for m in members}\\n        if \\\'BUNDLE-MANIFEST.json\\\' not in names:raise ValueError(\\\'manifest\\\')\\n        if any(not m.isfile() or m.size<0 or m.size>MAX_FILE for m in members):raise ValueError(\\\'member\\\')\\n        meta=json.load(tar.extractfile(\\\'BUNDLE-MANIFEST.json\\\'))\\n        if type(meta) is not dict or set(meta)!={\\\'schema\\\',\\\'files\\\'} or meta[\\\'schema\\\']!=\\\'astra-synthetic-no-engine-bundle-v1\\\' or type(meta[\\\'files\\\']) is not dict:\\n            raise ValueError(\\\'manifest schema\\\')\\n        files=meta[\\\'files\\\']\\n        if set(files)!=names-{\\\'BUNDLE-MANIFEST.json\\\'} or sum(m.size for m in members)>MAX_TOTAL:raise ValueError(\\\'contents\\\')\\n        payload={}\\n        for name,info in files.items():\\n            if not PATH.fullmatch(name) or type(info) is not dict or set(info)!={\\\'sha256\\\',\\\'size\\\'}:raise ValueError(\\\'filename\\\')\\n            content=tar.extractfile(name).read(MAX_FILE+1)\\n            if len(content)!=info[\\\'size\\\'] or hashlib.sha256(content).hexdigest()!=info[\\\'sha256\\\']:raise ValueError(\\\'digest\\\')\\n            payload[name]=content\\n    os.mkdir(dest,0o700)\\n    os.chmod(dest,0o700)\\n    for name,data in sorted(payload.items()):\\n        directory,leaf=name.rsplit(\\\'/\\\',1)\\n        current=dest\\n        for part in directory.split(\\\'/\\\'):\\n            current=os.path.join(current,part)\\n            try:os.mkdir(current,0o700)\\n            except FileExistsError:\\n                s=os.lstat(current)\\n                if not stat.S_ISDIR(s.st_mode) or s.st_uid!=os.geteuid():raise ValueError(\\\'directory\\\')\\n        out=os.open(os.path.join(current,leaf),os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW|os.O_CLOEXEC,0o400)\\n        try:\\n            os.fchmod(out,0o400);view=memoryview(data)\\n            while view:\\n                n=os.write(out,view)\\n                if n<=0:raise ValueError(\\\'write\\\')\\n                view=view[n:]\\n            os.fsync(out)\\n        finally:os.close(out)\\n    return len(payload)\\n\\n\\ndef main():\\n    if len(sys.argv)!=1 or os.geteuid()!=0:raise ValueError(\\\'not fixed root invocation\\\')\\n    n=_extract(BUNDLE,DEST,BUNDLE_SHA)\\n    print(\\\'fixed_bundle=verified_extracted files=\\\'+str(n),flush=True)\\nif __name__==\\\'__main__\\\':\\n    try:main()\\n    except Exception:\\n        print(\\\'fixed_bundle=unknown\\\',flush=True);sys.exit(1)\\n\'\nWRAPPER=b\'"""Disabled bounded-record no-engine target VM control adapter.\\n\\nRuns only when a separately reviewed workflow creates a standard disposable VM\\nand authenticates the complete bundle before executing any privileged code.\\nOne baseline, no command arguments except the exact systemd scope identifier.\\nNever run on Android, shared hosts, with a real engine, model or secrets.\\nNo output claims sandboxing, full process cleanup, or VM decommission.\\n"""\\nimport json\\nimport os\\nimport pathlib\\nimport re\\nimport stat\\nimport subprocess\\nimport sys\\nimport time\\n\\nSOURCE=pathlib.Path(\\\'/run/astra-synthetic-bundle\\\')\\nBASE=pathlib.Path(\\\'/run/astra-synthetic-work\\\')\\nCG=pathlib.Path(\\\'/sys/fs/cgroup\\\')\\nREQUIRED={\\\'cpu\\\',\\\'memory\\\',\\\'pids\\\'}\\nSCOPE=re.compile(r\\\'astra-synthetic-ci-[0-9a-f]{32}\\\\.scope\\\\Z\\\')\\nENV={\\\'PATH\\\':\\\'/usr/bin:/bin\\\',\\\'LANG\\\':\\\'C\\\',\\\'LC_ALL\\\':\\\'C\\\',\\\'SYSTEMD_PAGER\\\':\\\'cat\\\'}\\n_STAGE=\\\'not_started\\\'\\n\\n\\ndef show(unit,prop):\\n    return subprocess.check_output([\\\'/usr/bin/systemctl\\\',\\\'show\\\',unit,\\\'--property=\\\'+prop,\\\'--value\\\'],\\n                                   text=True,timeout=5,env=ENV).strip()\\n\\ndef _read(path):return path.read_text().strip()\\ndef _write(path,value):path.write_text(value)\\n\\ndef check_owner(path,mode,uid=0):\\n    st=path.lstat()\\n    if not stat.S_ISDIR(st.st_mode) or st.st_uid!=uid or stat.S_IMODE(st.st_mode)!=mode:\\n        raise ValueError(\\\'directory\\\')\\n\\ndef _inside(unit):\\n    global _STAGE\\n    _STAGE=\\\'identity\\\'\\n    if os.geteuid()!=0 or SCOPE.fullmatch(unit) is None:raise ValueError(\\\'identity\\\')\\n    check_owner(SOURCE,0o700)\\n    _STAGE=\\\'delegation\\\'\\n    if show(unit,\\\'Delegate\\\')!=\\\'yes\\\':raise ValueError(\\\'delegation\\\')\\n    control=show(unit,\\\'ControlGroup\\\')\\n    members=[x[3:] for x in _read(pathlib.Path(\\\'/proc/self/cgroup\\\')).splitlines() if x.startswith(\\\'0::/\\\')]\\n    if members!=[control] or control!=\\\'/system.slice/\\\'+unit:raise ValueError(\\\'membership\\\')\\n    scope=CG/control.lstrip(\\\'/\\\')\\n    if set(_read(scope/\\\'cgroup.procs\\\').split())!={str(os.getpid())}:raise ValueError(\\\'scope\\\')\\n    if not REQUIRED.issubset(_read(scope/\\\'cgroup.controllers\\\').split()):raise ValueError(\\\'controllers\\\')\\n    _STAGE=\\\'cgroup_setup\\\'\\n    manager=scope/\\\'astra-manager\\\';work=scope/\\\'astra-work\\\'\\n    manager.mkdir(mode=0o700);_write(manager/\\\'cgroup.procs\\\',str(os.getpid()))\\n    if _read(scope/\\\'cgroup.procs\\\'):raise ValueError(\\\'scope process\\\')\\n    _write(scope/\\\'cgroup.subtree_control\\\',\\\'+cpu +memory +pids\\\')\\n    if not REQUIRED.issubset(_read(scope/\\\'cgroup.subtree_control\\\').split()):raise ValueError(\\\'scope controller\\\')\\n    work.mkdir(mode=0o700)\\n    if not REQUIRED.issubset(_read(work/\\\'cgroup.controllers\\\').split()) or _read(work/\\\'cgroup.procs\\\'):raise ValueError(\\\'work\\\')\\n    _write(work/\\\'cgroup.subtree_control\\\',\\\'+cpu +memory +pids\\\')\\n    if not REQUIRED.issubset(_read(work/\\\'cgroup.subtree_control\\\').split()):raise ValueError(\\\'work controller\\\')\\n    _STAGE=\\\'directories\\\'\\n    BASE.mkdir(mode=0o700);check_owner(BASE,0o700)\\n    (BASE/\\\'packages\\\').mkdir(mode=0o700);(BASE/\\\'root\\\').mkdir(mode=0o700)\\n    fds=[];result=None;clean=False\\n    try:\\n        flags=os.O_RDONLY|os.O_DIRECTORY|os.O_NOFOLLOW|os.O_CLOEXEC\\n        paths=(SOURCE,SOURCE/\\\'docs/ubuntu-runtime-evidence-20261119\\\',BASE/\\\'packages\\\',BASE/\\\'root\\\',CG,work)\\n        fds=[os.open(p,flags) for p in paths]\\n        sys.path.insert(0,str(SOURCE))\\n        from devtools import synthetic_no_engine_entry as entry\\n        _STAGE=\\\'entry\\\'\\n        result=entry._Entry(*fds[:4],str(BASE/\\\'root\\\'),*fds[4:])._run_once()\\n    finally:\\n        for fd in fds:\\n            try:os.close(fd)\\n            except OSError:pass\\n        _STAGE=\\\'cleanup\\\'\\n        try:\\n            _write(work/\\\'cgroup.kill\\\',\\\'1\\\');until=time.monotonic()+5\\n            while \\\'populated 1\\\' in _read(work/\\\'cgroup.events\\\') and time.monotonic()<until:time.sleep(.05)\\n            if \\\'populated 1\\\' in _read(work/\\\'cgroup.events\\\'):raise ValueError(\\\'populated\\\')\\n            for child in work.iterdir():\\n                if child.is_dir():child.rmdir()\\n            work.rmdir();clean=True\\n        except BaseException:pass\\n    if type(result) is not dict:raise ValueError(\\\'result\\\')\\n    if not clean:result[\\\'control\\\']=\\\'unknown\\\'\\n    result[\\\'delegated_work\\\']=\\\'empty_removed_sampled\\\' if clean else \\\'uncertain\\\'\\n    _STAGE=\\\'returned\\\'\\n    return result\\n\\n# No arbitrary manager properties, exception strings, names or output cross\\n# this boundary. Validating a category does not establish its truth.\\ndef validate(obj):\\n    from devtools import synthetic_no_engine_supervisor as common\\n    from devtools import systemd_pidfd_lookup as lookup\\n    allowed={\\n      \\\'fetch\\\':(\\\'unknown\\\',\\\'fixed_17_downloads_rehashed\\\'),\\n      \\\'fetch_guard\\\':(\\\'not_started\\\',\\\'cleanup_uncertain\\\',\\\'kill_returned_empty_removed_sampled\\\'),\\n      \\\'control\\\':(\\\'unknown\\\',\\\'blocked_entry_record_and_exit_sampled\\\'),\\n      \\\'staging\\\':(\\\'not_started\\\',\\\'not_guarded\\\',\\\'enrolled_sampled\\\',\\\'kill_returned_empty_removed_sampled\\\',\\\'cleanup_uncertain\\\'),\\n      \\\'service_watchdog\\\':(\\\'not_started\\\',\\\'ready_sampled\\\',\\\'kill_returned_empty_sampled\\\',\\\'outcome_uncertain\\\'),\\n      \\\'cleanup\\\':(\\\'not_verified\\\',),\\\'isolation\\\':(\\\'not_verified\\\',),\\\'vm_decommission\\\':(\\\'not_observed\\\',),\\n      \\\'delegated_work\\\':(\\\'empty_removed_sampled\\\',\\\'uncertain\\\'),\\n      \\\'wrapper_stage\\\':(\\\'not_started\\\',\\\'identity\\\',\\\'delegation\\\',\\\'cgroup_setup\\\',\\\'directories\\\',\\\'entry\\\',\\\'cleanup\\\',\\\'returned\\\'),\\n      \\\'supervisor_stage\\\':(\\\'not_observed\\\',\\\'setup_uncertain\\\',\\\'waiting_for_anchor\\\',\\\'deadline\\\',\\\'staging_watchdog_died\\\',\\\'watchdog_died\\\',\\\'early_worker_result\\\',\\\'anchor_handoff_failed\\\',\\\'watchdog_setup\\\',\\\'worker_running\\\',\\\'worker_channel_closed\\\',\\\'worker_result_received\\\',\\\'supervision_uncertain\\\'),\\n      \\\'worker\\\':(\\\'not_observed\\\',\\\'exited_sampled\\\',\\\'reap_uncertain\\\',\\\'reaped\\\',\\\'pidfd_unavailable\\\'),\\n      \\\'anchor\\\':(\\\'not_observed\\\',\\\'held_group_sampled\\\'),\\n      \\\'flow_stage\\\':common._FLOW_STAGES,\\\'owner_stage\\\':common._OWNER_STAGES,\\n      \\\'owner_reason\\\':common._OWNER_REASONS,\\\'start_phase\\\':commo