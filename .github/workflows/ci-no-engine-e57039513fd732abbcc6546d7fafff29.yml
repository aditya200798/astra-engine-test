name: Astra no-engine overlay one-shot
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: astra-no-engine-e57039513fd732abbcc6546d7fafff29
  cancel-in-progress: false
jobs:
  control:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fixed artifact checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: aditya200798/astra-engine-test
          ref: 'dd9208dc191f3dddfb4f845bd5a5ef8d8cf2ede6'
          path: astra-no-engine-input
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: ci-no-engine-6a570ae86913b6d42fd039d2d62902c8.tar.gz
          sparse-checkout-cone-mode: false
          lfs: false
          submodules: false
      - name: Bounded no-engine native control
        shell: bash
        timeout-minutes: 8
        run: |
          set -euo pipefail
          sudo -n /usr/bin/env -i RUNNER_ENVIRONMENT="${RUNNER_ENVIRONMENT:-}" RUNNER_OS="${RUNNER_OS:-}" GITHUB_REPOSITORY="${GITHUB_REPOSITORY:-}" GITHUB_EVENT_NAME="${GITHUB_EVENT_NAME:-}" GITHUB_WORKSPACE="${GITHUB_WORKSPACE:-}" /usr/bin/python3 -I - <<'ASTRA_WHOLE_STEP'
          SUPERVISOR='#!/usr/bin/python3\n"""Disabled private step supervisor: NOT a containment/cleanup proof.\n\nA hypothetical reviewed caller starts this before setup. It owns an absolute\nmonotonic budget, runs setup and then a single scope client, never retries, and\nkeeps a separate cancellation window. It cannot cancel systemd manager jobs.\n"""\nimport json, math, os, select, signal, subprocess, time\n_BLOCKED=True\n_MAX_RECORD=4096\n\nclass StepError(RuntimeError):pass\n\ndef _supervise(setup_argv, scope_argv, *, start, total, cleanup, term_grace=1, validate=None):\n    """Private testable composition; argv are not a public launch interface.\n\n    scope_argv is already fully constructed by the privileged reviewed caller;\n    no file descriptor is claimed to cross sudo/systemd. The invocation uses\n    only standard streams for its result and a decimal absolute deadline argv.\n    """\n    vals=(start,total,cleanup,term_grace)\n    if (any(type(x) not in (int,float) or not math.isfinite(x) for x in vals)\n        or not (0<term_grace<cleanup<total<=480) or start>time.monotonic()):\n        raise StepError(\'budget\')\n    cutoff=start+total-cleanup;end=start+total\n    outcome={\'outcome\':\'unknown\',\'phase\':\'setup\',\'deadline\':\'not_expired\',\n             \'cleanup\':\'not_verified\',\'late_start\':\'not_reconciled\',\n             \'vm_decommission\':\'not_observed\',\'engine_launch_authorized\':False,\n             \'production_approved\':False,\'diagnostic\':None}\n    def child(argv, phase):\n        if time.monotonic()>=cutoff:return None,\'deadline\'\n        argv=argv(cutoff) if callable(argv) else argv\n        # A fresh session leader remains a zombie (hence its PID cannot be\n        # recycled) until wait(). Do not reap before the last group signal.\n        p=subprocess.Popen(argv,stdin=subprocess.DEVNULL,stdout=subprocess.PIPE,\n                           stderr=subprocess.DEVNULL,start_new_session=True,close_fds=True)\n        os.set_blocking(p.stdout.fileno(),False)\n        data=bytearray();eof=False;bad=False\n        while time.monotonic()<cutoff:\n            ready,_,_=select.select([p.stdout],[],[],min(.05,max(0,cutoff-time.monotonic()))) if not eof else ([],[],[])\n            if ready:\n                part=os.read(p.stdout.fileno(),_MAX_RECORD+1-len(data))\n                if not part:eof=True\n                else:\n                    data.extend(part)\n                    if len(data)>_MAX_RECORD:bad=True;break\n            exited=bool(os.waitid(os.P_PID,p.pid,os.WEXITED|os.WNOHANG|os.WNOWAIT))\n            if exited and eof:\n                p.stdout.close();rc=p.wait()\n                if time.monotonic()>=cutoff:return None,\'deadline\'\n                return (bytes(data),rc),\'returned\'\n        # Signal the exact child process group, not a guessed systemd unit.\n        try:os.killpg(p.pid,signal.SIGTERM)\n        except ProcessLookupError:pass\n        until=min(end,time.monotonic()+term_grace)\n        while time.monotonic()<until:time.sleep(max(0,min(.01,until-time.monotonic())))\n        try:os.killpg(p.pid,signal.SIGKILL)\n        except ProcessLookupError:pass\n        # Reap only after the final signal; no process-group reuse before here.\n        while time.monotonic()<end and p.poll() is None:time.sleep(.01)\n        p.stdout.close()\n        return None,\'invalid\' if bad else \'deadline\'\n    try:\n        r,why=child(setup_argv,\'setup\')\n        if why!=\'returned\' or r[1]!=0:\n            outcome[\'deadline\']=\'expired\' if why==\'deadline\' else \'not_expired\'\n            return outcome\n        outcome[\'phase\']=\'scope\'\n        # Decimal monotonic deadline is delivered by argv, not an inherited FD.\n        r,why=child(lambda deadline:[*scope_argv,format(deadline,\'.9f\')],\'scope\')\n        if why!=\'returned\' or r[1]!=0:\n            outcome[\'deadline\']=\'expired\' if why==\'deadline\' else \'not_expired\'\n            return outcome\n        raw=r[0]\n        def pairs(items):\n            d={}\n            for k,v in items:\n                if k in d:raise ValueError(\'duplicate\')\n                d[k]=v\n            return d\n        if not raw.endswith(b\'\\n\') or raw.count(b\'\\n\')!=1:raise ValueError(\'record\')\n        obj=json.loads(raw,object_pairs_hook=pairs)\n        # The contract is a fixed, finite result vocabulary, not raw subprocess text.\n        if validate is None:\n            from devtools import genuine_delegated_diagnostics as diag\n            validate=diag.validate\n        validate(obj)\n        outcome[\'diagnostic\']=obj;outcome[\'outcome\']=\'synthetic_diagnostic_returned_cleanup_unverified\'\n    except BaseException:\n        pass\n    return outcome\n\ndef main():\n    if _BLOCKED:raise StepError(\'review required\')\n    raise StepError(\'no approved orchestration\')\nif __name__==\'__main__\':\n    try:main()\n    except Exception:print(\'genuine_step=blocked\',flush=True);raise SystemExit(1)\n'
          SETUP='exec /usr/bin/python3 -I -c \'import base64,zlib,subprocess,sys\nraw=zlib.decompress(base64.b64decode(\'"\'"\'\'"\'"\',validate=True))\nif len(raw)>500000:raise SystemExit(1)\nraise SystemExit(subprocess.run([\'"\'"\'/bin/bash\'"\'"\',\'"\'"\'-s\'"\'"\',\'"\'"\'--\'"\'"\',*sys.argv[1:]],input=raw).returncode)\n\' "$@"\n'
          CALL="import importlib.util,sys;sys.path.insert(0,'/run/astra-synthetic-bundle');s=importlib.util.spec_from_file_location('control','/run/astra-synthetic-bundle/ci-wrapper.py');m=importlib.util.module_from_spec(s);s.loader.exec_module(m);m._developer_main(sys.argv[1],float(sys.argv[2]))"
          import json,os,secrets,sys,time
          start=time.monotonic()
          for k,v in {'RUNNER_ENVIRONMENT':'github-hosted','RUNNER_OS':'Linux','GITHUB_REPOSITORY':'aditya200798/astra-engine-test','GITHUB_EVENT_NAME':'workflow_dispatch'}.items():
           if os.environ.get(k)!=v:raise SystemExit('no_engine_step=blocked')
          workspace=os.environ.get('GITHUB_WORKSPACE','')
          if os.geteuid()!=0 or (os.cpu_count() or 0)<2:raise SystemExit('no_engine_step=blocked')
          ns={'__name__':'private_step_supervisor'}
          exec(compile(SUPERVISOR,'<fixed supervisor>','exec'),ns)
          unit='astra-synthetic-ci-'+secrets.token_hex(16)+'.scope'
          os.environ.clear();os.environ.update({'PATH':'/usr/bin:/bin','LANG':'C','LC_ALL':'C'})
          setup=lambda deadline:['/bin/bash','-c',SETUP,'astra-setup',format(deadline,'.9f'),workspace]
          scope=['/usr/bin/systemd-run','--quiet','--scope','--unit='+unit,'-p','Delegate=yes','-p','MemoryMax=2G','-p','TasksMax=256','/usr/bin/python3','-I','-c',CALL,unit]
          sys.path.insert(0,'/run/astra-synthetic-bundle')
          def validate(obj):
           import importlib.util
           spec=importlib.util.spec_from_file_location('control_validation','/run/astra-synthetic-bundle/ci-wrapper.py')
           m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m);return m.validate(obj)
          r=ns['_supervise'](setup,scope,start=start,total=380,cleanup=30,validate=validate)
          print(json.dumps(r,sort_keys=True,separators=(',',':')),flush=True)
          d=r.get('diagnostic') or {}
          passed=(r['outcome']=='synthetic_diagnostic_returned_cleanup_unverified' and
           d.get('fetch')=='fixed_17_downloads_rehashed' and
           d.get('fetch_guard')=='kill_returned_empty_removed_sampled' and
           d.get('control')=='blocked_entry_record_and_exit_sampled' and
           d.get('staging')=='kill_returned_empty_removed_sampled' and
           d.get('service_watchdog')=='kill_returned_empty_sampled' and
           d.get('delegated_work')=='empty_removed_sampled' and
           d.get('owner_stage')=='finished' and d.get('record')=='received' and
           d.get('stop')=='job_done_inactive_snapshot')
          raise SystemExit(0 if passed else 1)
          
          ASTRA_WHOLE_STEP
